{% extends 'members/base.html' %}

{% block title %}Add Member - Gym Management{% endblock %}

{% block content %}
<div class="content-wrapper mx-auto" style="max-width: 600px; padding: 1rem; margin: 1rem auto; background: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <div class="text-center mb-4">
        <h1 class="mb-0"><i class="fas fa-user-plus me-2"></i>Add New Member</h1>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}
        {% if error %}
            <div class="alert alert-danger" role="alert">
                <p>{{ error }}</p>
            </div>
        {% endif %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">
                    <i class="fas fa-user me-2"></i>Name
                </label>
                <input type="text" class="form-control" id="name" name="name" required
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope me-2"></i>Email
                </label>
                <input type="email" class="form-control" id="email" name="email" required
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="phone_number" class="form-label">
                    <i class="fas fa-phone me-2"></i>Phone Number
                </label>
                <input type="tel" class="form-control" id="phone_number" name="phone_number"
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
            <div class="col-md-6 mb-3">
                <label for="dob" class="form-label">
                    <i class="fas fa-birthday-cake me-2"></i>DOB
                </label>
                <input type="date" class="form-control" id="dob" name="dob"
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="gender" class="form-label">
                    <i class="fas fa-venus-mars me-2"></i>Gender
                </label>
                <select class="form-select" id="gender" name="gender"
                        style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;"
                        aria-describedby="genderHelp">
                    <option value="">Choose...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <div id="genderHelp" class="form-text">Select the gender (optional).</div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="join_date" class="form-label">
                    <i class="fas fa-calendar-alt me-2"></i>Join Date
                </label>
                <input type="date" class="form-control" id="join_date" name="join_date" required
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
            <div class="col-md-6 mb-3">
                <label for="membership_type" class="form-label">
                    <i class="fas fa-id-card me-2"></i>Membership Type
                </label>
                <select class="form-select" id="membership_type" name="membership_type" required
                        style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
                    <option value="">Choose...</option>
                    <option value="strength">Strength</option>
                    <option value="cardio">Cardio</option>
                    <option value="crossfit">Crossfit</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="membership_start_date" class="form-label">
                    <i class="fas fa-calendar-plus me-2"></i>Membership Start Date
                </label>
                <input type="date" class="form-control" id="membership_start_date" name="membership_start_date" required
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
            <div class="col-md-6 mb-3">
                <label for="membership_end_date" class="form-label">
                    <i class="fas fa-calendar-times me-2"></i>Membership End Date
                </label>
                <input type="date" class="form-control" id="membership_end_date" name="membership_end_date" required
                       style="border-radius: 10px; border: 2px solid #e9ecef; transition: border-color 0.3s ease;">
            </div>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" checked
                   style="border-radius: 4px; border: 2px solid #e9ecef;">
            <label class="form-check-label" for="is_active">
                <i class="fas fa-toggle-on me-2"></i>Is Active
            </label>
        </div>
        <div class="text-center">
            <button type="submit" class="btn-modern me-2">
                <i class="fas fa-save me-2"></i>Add Member
            </button>
            <a href="{% url 'member_list' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to List
            </a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const inputs = document.querySelectorAll('input, select');

        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#667eea';
                this.style.boxShadow = '0 0 0 0.2rem rgba(102, 126, 234, 0.25)';
            });

            input.addEventListener('blur', function() {
                this.style.borderColor = '#e9ecef';
                this.style.boxShadow = 'none';
            });
        });



        // Auto-focus on name field
        document.getElementById('name').focus();
    });
</script>
{% endblock %}
